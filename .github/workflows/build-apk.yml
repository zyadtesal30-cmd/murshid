name: Build Murshid APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout project
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 3. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 4. Install dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential

      # 5. Install Buildozer
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer
          pip install Cython==0.29.34

      # 6. Check configuration
      - name: Check buildozer.spec
        run: |
          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found!"
            exit 1
          fi

          echo "buildozer.spec found successfully"

      # 7. Accept Android SDK licenses
      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

          SDKMANAGER=$(find "$HOME/.buildozer" \
            -name sdkmanager -type f 2>/dev/null | head -n 1)

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
          else
            echo "SDK Manager not installed yet."
          fi

      # 8. Build APK
      - name: Build Android APK
        env:
          P4A_RELEASE_KEYSTORE: ""
        run: |
          yes | buildozer android debug

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Murshid-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
```
